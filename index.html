   (This is the FIRESTORE version — no Realtime Database needed.)

/* ============================================================ */

let db = null, serverOffset = 0;
if (CONFIG_OK) {
  const fbApp = initializeApp(firebaseConfig);

/* ---------- constants ---------- */
const ORDER   = ["white","blue","green","yellow","red"];
const NUMBERS = { white:5, blue:6, green:1, yellow:3, red:9 };
const HEX     = { white:"#f2f2f2", blue:"#2f6bff", green:"#25d05b", yellow:"#ffd21c", red:"#ff2d2d" };
const ROLES   = [
  {r:"main",   label:"MAIN PHONE (bomb + timer)", color:"#ff8c1a"},
  {r:"white",  label:"WIRE — WHITE",  color:HEX.white},

];

const MINS   = parseFloat(params.get("mins") || "5");

const gameRef = (key) => doc(db, GAMES_COLLECTION, String(key));

/* ---------- server clock sync (Firestore has no built-in offset) ---------- */
async function syncClock(){
  try{
    const r = doc(collection(db, "_clock"));
    const t0 = Date.now();
    await setDoc(r, { t: serverTimestamp() });
    const snap = await getDoc(r);
    const t1 = Date.now();
    const st = snap.data() && snap.data().t;
    if (st && st.toMillis){ serverOffset = st.toMillis() - Math.round((t0 + t1) / 2); }
    deleteDoc(r).catch(()=>{});
  }catch(e){ /* offline / rules — fall back to local clock */ }
}

/* ---------- audio ---------- */

function audioInit(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }

addEventListener("click", audioInit, {once:true});
function beep(freq,dur=0.05,type="square",vol=0.05){ if(!actx) return; try{
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);}catch(e){}}
function boom(){ if(!actx) return; try{
  const o=actx.createOscillator(),g=actx.createGain();o.type="sawtooth";
  o.frequency.setValueAtTime(140,actx.currentTime);o.frequency.exponentialRampToValueAtTime(18,actx.currentTime+0.9);
  g.gain.setValueAtTime(0.6,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+1.0);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+1.0);
  const b=actx.createBuffer(1,actx.sampleRate*0.8,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=actx.createBufferSource();s.buffer=b;const ng=actx.createGain();ng.gain.value=0.5;
  s.connect(ng);ng.connect(actx.destination);s.start();}catch(e){}}

/* ---------- helpers ---------- */
function fmt(ms){ ms=Math.max(0,ms);const t=Math.ceil(ms/1000);const m=String(Math.floor(t/60)).padStart(2,"0");const s=String(t%60).padStart(2,"0");return m+":"+s; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startMillis(g){
  if(!g) return null;
  const s=g.started;
  if(s==null) return null;
  if(typeof s==="number") return s;
  if(s.toMillis) return s.toMillis();     // Firestore Timestamp
  return null;
}

/* ---------- Firestore data access ---------- */
async function loadTeams(){
  const qs = await getDocs(collection(db, TEAMS_COLLECTION));
  const out = [];
  qs.forEach(d=>{
    const t = d.data() || {};
    const pass = t.passcode ?? t.password ?? t.accessCode ?? t.code ?? t.pin ?? "";
    const name = t.name ?? t.teamName ?? t.title ?? d.id;
    out.push({ key:d.id, name:String(name), passcode:String(pass), order:(t.order ?? null) });
  });
  out.sort((a,b)=>{
    if(a.order!=null && b.order!=null) return a.order-b.order;
    return a.key.localeCompare(b.key);
  });
  return out;
}
async function fetchTeamName(key){
  try{ const s=await getDoc(doc(db, TEAMS_COLLECTION, String(key))); const v=s.data(); return (v&&(v.name??v.teamName??v.title))||key; }
  catch(e){ return key; }
}
async function fetchOwnerPass(){
  // owner passcode stored at config/owner {passcode}
  try{ const s=await getDoc(doc(db,"config","owner")); const v=s.data(); return v ? String(v.passcode ?? v.code ?? "") : null; }
  catch(e){ return null; }
}

      <span class="badge" id="teamBadge">…</span>
      <span class="badge" id="stateBadge">● ARMED</span>
    </div>
    <div class="big-clock crit" id="bigClock">05:00</div>
    <div class="door"><div class="window"></div></div>
    <div class="bomb-wrap">
      <div class="bomb">
        <div class="wires">${wires}</div>
        <div class="led"></div>
        <div class="fuse"><div class="cord"></div><div class="spark"></div></div>
        <div class="sticks"><div class="stick"></div><div class="stick"></div><div class="stick"></div></div>
        <div class="timer-display crit" id="bombTimer">05:00</div>
      </div>
    </div>
    <div class="instr" id="instr">
      <button class="closebtn" id="closeInstr">✕ CLOSE</button>
      <h2>Arming &amp; Maintenance Parameters</h2>
      <h3>Architecture:</h3>
      <ul>
        <li class="wl-white"><b>White Wire:</b> Network Firewall Shielding</li>
        <li class="wl-blue"><b>Blue Wire:</b> Liquid Coolant Circulation</li>
        <li class="wl-green"><b>Green Wire:</b> Kinetic Tamper Sensor</li>
        <li class="wl-yellow"><b>Yellow Wire:</b> Logic Controller Loop</li>
        <li class="wl-red"><b>Red Wire:</b> Main Detonator Core</li>
      </ul>
      <h3>Defusal Safeguards (READ CAREFULLY):</h3>
      <ol>
        <li>The <b>White Wire</b> actively protects the entire system. Severing any other wire while the White Firewall is still active will trigger a distress signal and cause immediate detonation.</li>
        <li>The <b>Red Wire</b> is the actual detonator. It will explode instantly if severed while the <b>Yellow Wire</b> or <b>Green Wire</b> are still connected to the system.</li>
        <li>The <b>Green Wire</b> is highly volatile and draws a protective electrical current from the <b>Blue Wire</b>. If the Green Wire is cut before the Blue Wire is severed, the shockwave will trigger the explosive.</li>
        <li>The <b>Yellow Wire</b> monitors the system's internal logic. If it is cut while the <b>Green Wire</b> is still attached, the logic loop breaks and detonates the bomb.</li>
        <li>The <b>Blue Wire</b> maintains the thermal coolant. Once it is severed, the device's core will begin to overheat rapidly. You will have exactly <b>90 seconds</b> to finish disarming the device before it melts down and explodes.</li>
      </ol>
    </div>
    <div class="flash" id="flash"></div>
    <div class="aftermath" id="after">
      <div class="boom">💥</div>
      <h1>FAKE ALARM</h1>

    </div>
    <div class="tabbar"><div class="tab" id="btnInstr">📋 Instructions</div></div>
  </div>`;

  fetchTeamName(team).then(n=>{ const el=document.getElementById("teamBadge"); if(el) el.textContent=n; });
  document.getElementById("btnInstr").onclick = ()=>document.getElementById("instr").classList.add("open");
  document.getElementById("closeInstr").onclick = ()=>document.getElementById("instr").classList.remove("open");

  setTimeout(ensureStarted, 600);

  let startAt=null, dur=GAME_MS, exploded=false, lastSec=-1;
  onSnapshot(gameRef(team), snap=>{
    const g=snap.data();
    if(g && g.started){ const sm=startMillis(g); if(sm){ startAt=sm; dur=g.dur||GAME_MS; } }
    else { startAt=null; }   // owner reset
  });

  const bigClock=document.getElementById("bigClock");
  const bombTimer=document.getElementById("bombTimer");

  function tick(){
    if(startAt){
      const rem = startAt + dur - now();
      bigClock.textContent = bombTimer.textContent = fmt(rem);
      const sec = Math.ceil(Math.max(0,rem)/1000);
      bigClock.className = "big-clock " + (rem<=60000 ? "warn":"");
      bombTimer.className = "timer-display " + (rem<=30000?"crit":rem<=60000?"warn":"");
      if(rem>0 && sec!==lastSec){ lastSec=sec; beep(rem<=10000?1200:520, 0.04, "square", 0.04); }
      if(rem<=0 && !exploded){ exploded=true; detonate(); }
    } else {

  }
}

async function ensureStarted(){
  try{
    await runTransaction(db, async (tx)=>{
      const ref=gameRef(team);
      const s=await tx.get(ref);
      const d=s.data();
      if(s.exists() && d && d.started) return;                       // already running
      tx.set(ref, { started: serverTimestamp(), dur: GAME_MS, progress: (d&&d.progress)||0 });
    });
  }catch(e){ console.warn(e); }
}

/* ============================================================ WIRE PHONES ============================================================ */
function renderWire(wire){
  const num = NUMBERS[wire];
  app.className="";
  app.innerHTML = `
  <div class="wire-screen" id="wscreen">
    <div class="wire-top"><span class="badge" id="teamBadge">…</span><span class="badge">${wire.toUpperCase()} LINE</span></div>
    <div id="standby" class="standby">◌ STANDBY ◌<small>awaiting activation from the main device…</small></div>
    <div id="active" class="hidden">
      <div class="wire-name">${wire} wire</div>
      <div class="wire-visual" id="wireHit"><div class="cable" style="--c:${HEX[wire]}"></div><div class="grip">✂️</div></div>
      <div class="wire-hint">TAP THE WIRE TO <b>CUT</b></div>
    </div>
    <div class="toast" id="toast">TRY AGAIN</div>
    <div class="lock" id="lock">
      <div class="tri"><span>!</span></div>
      <h2>WRONG SEQUENCE</h2>
      <div class="cd" id="lockcd">20</div>
      <small>SYSTEM LOCKED — STAND BY</small>
    </div>
    <div class="numscreen" id="numscreen">
      <div class="ash"></div>
      <div class="lbl">▓ SIGNAL DECRYPTED ▓</div>
      <div class="digit">${num}</div>
      <div class="foot">MEMORIZE THIS DIGIT · FIND YOUR STATION</div>
    </div>
  </div>`;

  fetchTeamName(team).then(n=>{ const el=document.getElementById("teamBadge"); if(el) el.textContent=n; });

  const elStandby=document.getElementById("standby");
  const elActive =document.getElementById("active");
  const elLock   =document.getElementById("lock");
  const elLockCd =document.getElementById("lockcd");
  const elToast  =document.getElementById("toast");
  const elNum    =document.getElementById("numscreen");
  const hit      =document.getElementById("wireHit");

  const LKEY = `lock_${team}_${wire}`;
  let lockUntil = parseInt(localStorage.getItem(LKEY) || "0", 10);
  let startAt=null, dur=GAME_MS, exploded=false, busy=false;

  onSnapshot(gameRef(team), snap=>{
    const g=snap.data();
    if(g && g.started){ const sm=startMillis(g); if(sm){ startAt=sm; dur=g.dur||GAME_MS; } }
    else { startAt=null; exploded=false; elNum.classList.remove("show"); }  // owner reset
  });

  function isLocked(){ return Date.now() < lockUntil; }
  hit.addEventListener("click", onTap);

  async function onTap(){
    if(busy || exploded || isLocked() || !startAt) return;
    busy=true;
    try{
      let outcome="";
      await runTransaction(db, async (tx)=>{
        const ref=gameRef(team);
        const s=await tx.get(ref);
        if(!s.exists()){ outcome="wrong"; return; }
        const d=s.data()||{};
        const cur = (typeof d.progress==="number") ? d.progress : 0;
        const expected = ORDER[cur];
        if(wire === expected){ outcome="correct"; let n=cur+1; if(n>=ORDER.length) n=0; tx.update(ref,{progress:n}); }
        else { outcome="wrong"; }   // no write → progress unchanged
      });
      if(outcome==="correct"){ showToast(); beep(660,0.05,"triangle",0.05); }
      else if(outcome==="wrong"){ startLock(); }
    }catch(e){ console.warn(e); }
    busy=false;
  }
  function showToast(){ elToast.classList.remove("show"); void elToast.offsetWidth; elToast.classList.add("show"); }
  function startLock(){
    lockUntil = Date.now() + 20000;
    localStorage.setItem(LKEY, String(lockUntil));
    beep(120,0.4,"sawtooth",0.08);
    if(navigator.vibrate) navigator.vibrate([400,120,400]);
  }
  function tick(){
    const armed=!!startAt;
    const rem=armed?(startAt+dur-now()):null;
    if(armed && rem<=0){
      if(!exploded){ exploded=true; if(navigator.vibrate) navigator.vibrate([200,60,300]); boom(); }
      elNum.classList.add("show"); elLock.classList.remove("show");
      requestAnimationFrame(tick); return;
    }
    elStandby.classList.toggle("hidden", armed);
    elActive.classList.toggle("hidden", !armed);
    if(isLocked()){ elLock.classList.add("show"); elLockCd.textContent=Math.ceil((lockUntil-Date.now())/1000); }
    else{ elLock.classList.remove("show"); }
    requestAnimationFrame(tick);
  }
  tick();
}

function askPasscode(t){
  const ov=document.createElement("div"); ov.className="passwrap";
  ov.innerHTML=`
    <div class="passcard">
      <div class="passtitle">${esc(t.name)}</div>
      <div class="passsub">Enter team passcode</div>
      <input id="passin" class="passin" inputmode="numeric" autocomplete="off" placeholder="••••" />
      <div id="passerr" class="passerr"></div>
      <div class="passbtns">
        <button id="passcancel" class="passbtn ghost">Cancel</button>
        <button id="passok" class="passbtn go">Unlock</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const inp=ov.querySelector("#passin"); setTimeout(()=>inp.focus(),50);
  const submit=()=>{
    const ok = t.passcode!=="" && String(inp.value).trim()===String(t.passcode).trim();
    if(ok){ ov.remove(); renderTeamConsole(t); }
    else{
      ov.querySelector("#passerr").textContent="✖ Wrong passcode — try again";
      const card=ov.querySelector(".passcard"); card.classList.add("shakeit");
      setTimeout(()=>card.classList.remove("shakeit"),500);
      if(navigator.vibrate) navigator.vibrate(200);
      inp.value=""; inp.focus();
    }
  };
  ov.querySelector("#passok").onclick=submit;
  ov.querySelector("#passcancel").onclick=()=>ov.remove();
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
}

function renderTeamConsole(t){
  app.className="";
  const base=location.origin+location.pathname;
  let rows="";
  ROLES.forEach(o=>{
    const url=`${base}?role=${o.r}&team=${encodeURIComponent(t.key)}`;
    const id=`qr_${o.r}`;
    rows+=`
    <div class="linkrow">
      <div class="qr" id="${id}"></div>
      <div class="linkmeta">
        <div class="role"><span class="dot" style="color:${o.color};background:${o.color}"></span>${o.label}</div>
        <a href="${url}" target="_blank">${url}</a>
      </div>
      <button class="copybtn" data-url="${esc(url)}">Copy</button>
    </div>`;
  });
  app.innerHTML=`
  <div class="home">
    <button class="backbtn" id="back">‹ TEAMS</button>
    <h1>▣ ${esc(t.name)}</h1>
    <div class="lead">Hand each of this team's 6 phones its link or QR code. Opening the <b>MAIN</b> link starts this team's own 5-minute timer — other teams are unaffected.</div>
    ${rows}
    <div class="foot">Sequence: WHITE → BLUE → GREEN → YELLOW → RED · Codes after blast: W5 · B6 · G1 · Y3 · R9</div>
  </div>`;
  document.getElementById("back").onclick=renderHome;
  if(window.QRCode){
    ROLES.forEach(o=>{
      const url=`${base}?role=${o.r}&team=${encodeURIComponent(t.key)}`;
      const box=document.getElementById(`qr_${o.r}`);
      try{ new QRCode(box,{text:url,width:80,height:80,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
    });
  }
  app.querySelectorAll(".copybtn").forEach(b=>{
    b.onclick=()=>{ const u=b.getAttribute("data-url");
      navigator.clipboard?.writeText(u).then(()=>{ b.textContent="Copied!"; setTimeout(()=>b.textContent="Copy",1200);} )
      .catch(()=>prompt("Copy this link:",u)); };
  });
}

async function renderOwner(){
  app.className="";
  app.innerHTML=`<div class="home"><h1>🛠 OWNER CONTROL</h1><div class="tiny" style="padding:20px">Loading…</div></div>`;
  let opass=null, teams=[];
  try{ opass=await fetchOwnerPass(); }catch(e){}
  try{ teams=await loadTeams(); }catch(e){}
  const show=()=>ownerPanel(teams);
  if(opass) ownerGate(String(opass), show); else show();
}

function ownerGate(code, cb){
  const ov=document.createElement("div"); ov.className="passwrap";
  ov.innerHTML=`
    <div class="passcard">
      <div class="passtitle">🛠 OWNER</div>
      <div class="passsub">Enter owner passcode</div>
      <input id="op" class="passin" inputmode="numeric" autocomplete="off" placeholder="••••" />
      <div id="oe" class="passerr"></div>
      <div class="passbtns"><button id="ok" class="passbtn go">Unlock</button></div>
    </div>`;
  document.body.appendChild(ov);
  const inp=ov.querySelector("#op"); setTimeout(()=>inp.focus(),50);
  const go=()=>{ if(String(inp.value).trim()===String(code).trim()){ ov.remove(); cb(); }
    else{ ov.querySelector("#oe").textContent="✖ Wrong passcode"; inp.value=""; inp.focus(); } };
  ov.querySelector("#ok").onclick=go;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}

function ownerPanel(teams){
  app.className="";
  app.innerHTML=`
  <div class="home">
    <h1>🛠 OWNER CONTROL</h1>
    <div class="lead">Reset a single team, or reset everything. Resetting clears that team's 5-minute countdown and cut-progress on all of its phones instantly.</div>
    <div id="ownlist"></div>
    <button id="resetall" class="dangerbtn">💥 RESET ALL TEAMS</button>
    <div id="owntoast" class="tiny" style="text-align:center;margin-top:16px;min-height:16px"></div>
    <div class="foot">Only reachable at the owner link — players never see this screen.</div>
  </div>`;
  const list=document.getElementById("ownlist");
  const toast=(m)=>{ const el=document.getElementById("owntoast"); el.textContent=m; };
  if(!teams.length){
    list.innerHTML=`<div class="warnbox">No teams found. Add a <b>${esc(TEAMS_COLLECTION)}</b> collection in Firestore (see README).</div>`;
  } else {
    teams.forEach(t=>{
      const row=document.createElement("div"); row.className="ownrow";
      row.innerHTML=`<span class="ownname">▣ ${esc(t.name)}</span>`;
      const btn=document.createElement("button"); btn.className="copybtn"; btn.textContent="Reset";
      btn.onclick=async()=>{
        if(confirm(`Reset "${t.name}"? This restarts its timer and clears its progress.`)){
          try{ await deleteDoc(gameRef(t.key)); toast(`✔ "${t.name}" reset`); }
          catch(e){ toast("✖ Reset failed — check rules"); }
        }
      };
      row.appendChild(btn); list.appendChild(row);
    });
  }
  document.getElementById("resetall").onclick=async()=>{
    if(confirm("Reset ALL teams? This wipes every team's timer and progress.")){
      try{
        const qs=await getDocs(collection(db, GAMES_COLLECTION));
        const jobs=[]; qs.forEach(d=>jobs.push(deleteDoc(d.ref)));
        await Promise.all(jobs);
        toast("✔ All teams reset");
      }catch(e){ toast("✖ Reset failed — check rules"); }
    }
  };
}
